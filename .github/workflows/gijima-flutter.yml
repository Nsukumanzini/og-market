name: Gijima mock app checks
on:
  push:
    branches: [gijima-mfana-phase1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web
  operations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [merchant, courier, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
